name: Checks
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  flake:
    name: Run Nix flake checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize Nix store paths
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix
      # https://github.com/cachix/install-nix-action/issues/56#issuecomment-1030697681
      - name: Configure Nix store cache
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-nix-store-${{ hashFiles('flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nix-store-
          # See https://github.com/actions/cache/pull/726 and
          # https://github.com/actions/cache/issues/494 for caveats on negative
          # patterns.
          path: |
            /nix/store/**
            /nix/var/nix/*/*
            /nix/var/nix/db/*
            /nix/var/nix/db/*/**
            !/nix/var/nix/daemon-socket/socket
            !/nix/var/nix/userpool/*
            !/nix/var/nix/gc.lock
            !/nix/var/nix/db/big-lock
            !/nix/var/nix/db/reserved
      # The NixOS VM test needs /dev/kvm inside the Nix build sandbox.  GitHub's
      # Linux runners have KVM, but the device is only accessible to root; the
      # udev rule opens it to the nixbld users.
      # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-linux-larger-hosted-runners/
      - name: Enable KVM for the Nix build sandbox
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Run Nix flake checks
        run: |
          nix flake check -L
