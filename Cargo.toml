[package]
name = "deezns"
version = "0.1.0"
edition = "2021"

[lib]
name = "nss_deezns"
crate-type = ["cdylib"] # NSS module must be a C shared library

[[bin]]
name = "deezns-daemon"
path = "src/daemon.rs"

[dependencies]
libnss = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
toml = "0.8"
cel-interpreter = { version = "0.10", features = ["regex"] }
# /proc/net socket tables and /proc/<pid> for the DNS front-end.
procfs = { version = "0.18", default-features = false }
